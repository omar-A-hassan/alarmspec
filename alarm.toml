# Configuration of the alarm system that the checks use. conformance.py, blackbox.py, the
# adapter and the model instance (MC.tla, MC.cfg, Recalls.cfg) read this file.
# Do not edit this file: the recall scripts in check.sh use these condition names. To
# check a different alarm system, copy this file and set ALARM_CONFIG to the copy.
#
# Write one condition for each type of alarm condition in your device. A type is a
# combination of priority, latching, detector escalation and timed escalation. Add a
# second condition with the same priority if the tie-break order is important. Use short
# timers.
#
# The number of model states increases quickly with conditions and ticks. On an Apple
# M-series computer, this file (4 conditions) gives 53,940 states, and blackbox.py takes
# approximately 1.5 minutes. A file with 5 conditions gives 358,260 states, and TLC takes
# approximately 7 minutes. Use 5 conditions or fewer.
#
# The conditions have the numbers 0, 1, 2, ... in the order below. If two sounding
# conditions have the same priority, the tone plays the condition with the lower number.

pause_ticks = 2        # length of AUDIO PAUSED and ALARM PAUSED
reminder_ticks = 2     # interval between reminder signals in AUDIO OFF and ALARM OFF
escalate_ticks = 2     # ticks until a timed condition escalates to HIGH
low_audible = false    # true: LOW priority conditions sound

[[conditions]]
name = "h1"
priority = "HIGH"
latching = true

[[conditions]]
name = "h2"
priority = "HIGH"

[[conditions]]
name = "m1"
priority = "MEDIUM"
latching = true
escalating = true      # the detector can escalate this condition to HIGH

[[conditions]]
name = "l1"
priority = "LOW"
timed = true           # escalates to HIGH after escalate_ticks
